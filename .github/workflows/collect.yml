name: Collect and validate

on:
  workflow_dispatch:
  schedule:
    # 23:30 UTC on weekdays. This validates the demo contract until live providers exist.
    - cron: "30 23 * * 1-5"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm collect:demo
      - uses: actions/upload-artifact@v4
        with:
          name: capex-lens-demo-snapshot
          path: .data/demo-snapshot.json
          retention-days: 7
