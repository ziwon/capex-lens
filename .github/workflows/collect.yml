name: Collect and publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated live snapshot to Cloudflare D1 and R2
        required: false
        default: false
        type: boolean
  schedule:
    # 23:30 UTC on weekdays, after the regular US equity close.
    - cron: "30 23 * * 1-5"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile

      - name: Select collection mode
        id: mode
        shell: bash
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [[ -n "${TWELVE_DATA_API_KEY}" && -n "${FRED_API_KEY}" ]]; then
            echo "live=true" >> "${GITHUB_OUTPUT}"
            echo "Using Twelve Data and FRED live providers"
          else
            echo "live=false" >> "${GITHUB_OUTPUT}"
            echo "Live provider secrets are absent; validating the demo contract instead"
          fi

      - name: Collect live data
        if: steps.mode.outputs.live == 'true'
        run: pnpm collect:live
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVE_DATA_CREDITS_PER_MINUTE: ${{ vars.TWELVE_DATA_CREDITS_PER_MINUTE || '8' }}
          COLLECTION_LOOKBACK_DAYS: ${{ vars.COLLECTION_LOOKBACK_DAYS || '500' }}

      - name: Validate demo snapshot
        if: steps.mode.outputs.live != 'true'
        run: pnpm collect:demo

      - uses: actions/upload-artifact@v4
        with:
          name: capex-lens-collection-${{ github.run_id }}
          path: .data/
          retention-days: 14
          if-no-files-found: error

      - name: Publish live data to Cloudflare
        if: >-
          steps.mode.outputs.live == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
          vars.ENABLE_LIVE_PUBLISH == 'true')
        run: pnpm publish:live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'capex-lens' }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'capex-lens-raw' }}
